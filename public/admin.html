<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Praveka Life Science</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f6f2;color:#16241a}
header{background:#1f4d2e;color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{margin-right:auto;font-size:18px}
main{max-width:1000px;margin:0 auto;padding:20px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:#1f4d2e;color:#fff}
button.g{background:#e3e8df;color:#16241a}button.r{background:#b3402a}
header button{background:rgba(255,255,255,.15)}header button.on{background:#e3a817;color:#2a1f00}
input,select,textarea{width:100%;padding:8px;border:1px solid #c9d1c4;border-radius:6px;background:#fff}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}
.box{background:#fff;border:1px solid #d9dfd3;border-radius:10px;padding:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid #e3e8df;text-align:left}
.oh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.oh select{width:auto}
.err{color:#b3402a;min-height:1.4em}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row2{grid-template-columns:1fr}}
#login{max-width:340px;margin:12vh auto}
</style></head><body>
<div id="login" class="box"><h2>Admin login</h2><form id="lf"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"><p class="err" id="le"></p><button>Log in</button></form></div>
<div id="app" hidden>
<header><b>Praveka admin</b><button data-t="products" class="on">Products</button><button data-t="orders">Orders</button><button data-t="msgs">Messages</button><button id="lo">Log out</button></header>
<main>
<section id="t-products">
<div class="box"><button id="addP">Add new product</button>
<button class="g" id="upB">Import from Excel (CSV)</button><input type="file" id="upF" accept=".csv,text/csv" hidden>
<button class="g" id="dlP">Download current products</button><button class="g" id="dlT">Download blank template</button>
<p id="imsg" style="min-height:1.4em;margin:8px 0 0"></p></div>
<div class="box" id="pfw" hidden><h3 id="pft">Add product</h3><form id="pf">
<div class="row2"><div><label>Product name</label><input name="n" required></div>
<div><label>Category</label><select name="c"><option>Insecticide</option><option>Fungicide</option><option>Herbicide</option><option>Fertilizer</option><option>PGR &amp; Nutrition</option></select></div>
<div><label>Brand</label><input name="brand"></div><div><label>Technical name</label><input name="t"></div>
<div><label>Formulation type (e.g. SC, EC, WG)</label><input name="ftype"></div><div><label>Form (e.g. Liquid)</label><input name="form"></div>
<div><label>Concentration</label><input name="conc"></div><div><label>Application type (e.g. Larvicide)</label><input name="apptype"></div>
<div><label>Physical form</label><input name="phys"></div><div><label>Packaging type (e.g. Bottle)</label><input name="ptype"></div>
<div><label>Dosage</label><input name="dose"></div><div><label>Minimum order quantity (e.g. 10 Litre)</label><input name="moq"></div></div>
<label>Headline (one line under the table)</label><input name="head">
<label>Description</label><textarea name="desc" rows="3"></textarea>
<label>Key features (one per line)</label><textarea name="features" rows="4"></textarea>
<div class="row2"><div><label>Mode of action</label><textarea name="mode" rows="2"></textarea></div><div><label>Targets (pests)</label><textarea name="pests" rows="2"></textarea></div></div>
<label>Ideal for crops</label><input name="crops">
<label>Pack sizes: one per line as  size, price, MRP  (example: 250 ml, 349, 430)</label><textarea name="sizes" rows="4" required></textarea>
<label>Photos: one per line, a file name from public/images (example: no-one.jpg) or a https link. Up to 4.</label><textarea name="images" rows="3"></textarea>
<div class="row2"><div><label>Video link (https)</label><input name="video"></div><div><label>Brochure PDF link (https)</label><input name="brochure"></div></div>
<label><input type="checkbox" name="sale" style="width:auto"> Show "Sale" tag</label>
<p class="err" id="pe"></p><button>Save product</button> <button type="button" class="g" id="cx">Cancel</button></form></div>
<div class="box"><table><thead><tr><th>Name</th><th>Category</th><th>From</th><th></th></tr></thead><tbody id="pl"></tbody></table></div>
</section>
<section id="t-orders" hidden><div id="ol"></div></section>
<section id="t-msgs" hidden><div class="box"><h3>Contact messages</h3><div id="ml"></div></div><div class="box"><h3>Newsletter subscribers</h3><div id="sl"></div></div></section>
</main></div>
<script>
var T=sessionStorage.getItem("pls_t"),$=function(i){return document.getElementById(i)},PR=[],EID=null,ST=["New","Confirmed","Shipped","Delivered","Cancelled"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","x-admin-token":T||""},body:b?JSON.stringify(b):undefined});
 var j=await r.json().catch(function(){return{}});
 if(r.status===401&&u!=="/api/admin/login"){out();throw new Error("Please log in again")}
 if(!r.ok)throw new Error(j.error||"Something went wrong");return j}
function out(){T=null;sessionStorage.removeItem("pls_t");$("app").hidden=true;$("login").hidden=false}
$("lf").onsubmit=async function(e){e.preventDefault();try{var j=await api("POST","/api/admin/login",{password:$("pw").value});T=j.token;sessionStorage.setItem("pls_t",T);$("pw").value="";$("le").textContent="";start()}catch(x){$("le").textContent=x.message}};
$("lo").onclick=out;
function start(){$("login").hidden=true;$("app").hidden=false;loadP();loadO();loadM()}
document.querySelectorAll("header [data-t]").forEach(function(b){b.onclick=function(){document.querySelectorAll("header [data-t]").forEach(function(x){x.classList.toggle("on",x===b)});["products","orders","msgs"].forEach(function(t){$("t-"+t).hidden=t!==b.dataset.t})}});
async function loadP(){PR=await api("GET","/api/products");
 $("pl").innerHTML=PR.map(function(p){return"<tr><td>"+esc(p.n)+"</td><td>"+esc(p.c)+"</td><td>Rs. "+p.sizes[0][1]+"</td><td><button class='g' data-e='"+esc(p.id)+"'>Edit</button> <button class='r' data-d='"+esc(p.id)+"'>Delete</button></td></tr>"}).join("")||"<tr><td colspan=4>No products yet.</td></tr>"}
$("pl").onclick=async function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.e)openF(PR.find(function(p){return p.id===b.dataset.e}));
 else if(b.dataset.d&&confirm("Delete this product?")){try{await api("DELETE","/api/admin/products/"+encodeURIComponent(b.dataset.d));loadP()}catch(x){alert(x.message)}}};
var KEYS=["n","c","brand","head","t","ftype","form","conc","apptype","phys","ptype","dose","moq","desc","features","mode","pests","crops","video","brochure"];
function openF(p){EID=p?p.id:null;var f=$("pf").elements;$("pft").textContent=p?"Edit product":"Add product";
 KEYS.forEach(function(k){f[k].value=p?(p[k]||""):(k=="c"?"Insecticide":"")});
 f.sizes.value=p?p.sizes.map(function(z){return z.join(", ")}).join("\n"):"";f.sale.checked=!!(p&&p.sale);f.images.value=p&&p.images?p.images.join("\n"):"";$("pe").textContent="";$("pfw").hidden=false;f.n.focus()}
$("addP").onclick=function(){openF(null)};$("cx").onclick=function(){$("pfw").hidden=true};
$("pf").onsubmit=async function(e){e.preventDefault();var f=e.target.elements,b={sale:f.sale.checked,images:f.images.value.split("\n").map(function(x){return x.trim()}).filter(Boolean)};
 KEYS.forEach(function(k){b[k]=f[k].value});
 b.sizes=f.sizes.value.split("\n").filter(function(l){return l.trim()}).map(function(l){var a=l.split(",");return[(a[0]||"").trim(),Number(a[1]),Number(a[2])]});
 try{await api(EID?"PUT":"POST",EID?"/api/admin/products/"+encodeURIComponent(EID):"/api/admin/products",b);$("pfw").hidden=true;loadP()}catch(x){$("pe").textContent=x.message}};
async function loadO(){var L=await api("GET","/api/admin/orders");
 $("ol").innerHTML=L.length?L.map(function(o){return"<div class='box'><div class='oh'><b>"+esc(o.id)+"</b><span>"+new Date(o.date).toLocaleString("en-IN")+"</span><select data-id='"+esc(o.id)+"'>"+ST.map(function(s){return"<option"+(s===o.status?" selected":"")+">"+s+"</option>"}).join("")+"</select></div><div>"+esc(o.customer.name)+" &middot; "+esc(o.customer.phone)+"<br>"+esc(o.customer.address)+", PIN "+esc(o.customer.pincode)+"</div><ul>"+o.items.map(function(i){return"<li>"+esc(i.name)+" ("+esc(i.size)+") x "+i.qty+" = Rs. "+i.price*i.qty+"</li>"}).join("")+"</ul><b>Total Rs. "+o.total+"</b> &middot; "+esc(o.payment)+"</div>"}).join(""):"<div class='box'>No orders yet.</div>"}
$("ol").onchange=async function(e){if(e.target.dataset.id){try{await api("PATCH","/api/admin/orders/"+encodeURIComponent(e.target.dataset.id),{status:e.target.value})}catch(x){alert(x.message);loadO()}}};
async function loadM(){var j=await api("GET","/api/admin/messages");
 $("ml").innerHTML=j.messages.map(function(m){return"<p><b>"+esc(m.name)+"</b> ("+esc(m.phone)+") "+new Date(m.date).toLocaleDateString("en-IN")+"<br>"+(m.product?"<b>Product:</b> "+esc(m.product)+(m.quantity?" &times; "+esc(m.quantity):"")+"<br>":"")+esc(m.message)+"</p>"}).join("")||"No messages yet.";
 $("sl").innerHTML=j.subscribers.map(function(m){return"<div>"+esc(m.phone||m.email)+"</div>"}).join("")||"No subscribers yet."}
/*CSV*/
var HEAD=["id","name","category","brand","headline","description","technical_name","formulation_type","form","concentration","application_type","physical_form","packaging_type","dosage","mode_of_action","key_features","targets","crops","min_order_quantity","sale","size1","price1","mrp1","size2","price2","mrp2","size3","price3","mrp3","size4","price4","mrp4","image1","image2","image3","image4","video_url","brochure_url"];
var MAP={id:"id",name:"n",category:"c",brand:"brand",headline:"head",description:"desc",technicalname:"t",formulationtype:"ftype",form:"form",concentration:"conc",applicationtype:"apptype",physicalform:"phys",packagingtype:"ptype",dosage:"dose",dose:"dose",modeofaction:"mode",keyfeatures:"features",targets:"pests",targetpests:"pests",pests:"pests",crops:"crops",targetcrops:"crops",minimumorderquantity:"moq",minorderquantity:"moq",moq:"moq",videourl:"video",video:"video",brochureurl:"brochure",brochure:"brochure"};
function parseCSV(t){t=t.replace(/^\uFEFF/,"");var first=t.split(/\r?\n/)[0],d=[",",";","\t"].sort(function(a,b){return first.split(b).length-first.split(a).length})[0];
var rows=[],row=[],f="",q=false;
for(var i=0;i<t.length;i++){var c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==d){row.push(f);f=""}
 else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
if(f!==""||row.length){row.push(f);rows.push(row)}
return rows.filter(function(r){return r.some(function(x){return x.trim()})})}
function num(v){var m=String(v==null?"":v).replace(/,/g,"").match(/\d+(\.\d+)?/);return m?Number(m[0]):0}
function toProducts(rows){var H=rows[0].map(function(x){return x.toLowerCase().replace(/[^a-z0-9]/g,"")});
 ["name","category","size1","price1"].forEach(function(k){if(H.indexOf(k)<0)throw new Error('Column "'+k+'" is missing. Download the blank template and use its headings.')});
 return rows.slice(1).map(function(r){var o={},g=function(k){var i=H.indexOf(k);return i<0?"":(r[i]||"").trim()};
  H.forEach(function(h,i){if(MAP[h]&&!o[MAP[h]])o[MAP[h]]=(r[i]||"").trim()});
  o.features=(o.features||"").split(/\s*\|\s*|\r?\n/).filter(function(x){return x.trim()}).join("\n");
  o.sale=/^(yes|y|true|1)$/i.test(g("sale"));o.sizes=[];o.images=[];
  for(var n=1;n<=4;n++){var l=g("size"+n);if(l){var p=num(g("price"+n)),m=g("mrp"+n)?num(g("mrp"+n)):p;o.sizes.push([l,p,m])}var im=g("image"+n);if(im)o.images.push(im)}return o})}
function csvq(v){v=String(v==null?"":v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(list){return[HEAD.join(",")].concat(list.map(function(p){
 var a=[p.id||"",p.n,p.c,p.brand,p.head,p.desc,p.t,p.ftype,p.form,p.conc,p.apptype,p.phys,p.ptype,p.dose,p.mode,(p.features||"").split("\n").join(" | "),p.pests,p.crops,p.moq,p.sale?"yes":"no"];
 for(var i=0;i<4;i++){var z=p.sizes&&p.sizes[i];a.push(z?z[0]:"",z?z[1]:"",z?z[2]:"")}
 for(var k=0;k<4;k++)a.push(p.images&&p.images[k]||"");a.push(p.video||"",p.brochure||"");
 return a.map(csvq).join(",")})).join("\r\n")}
function dl(name,text){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function msg(t,ok){var e=$("imsg");e.textContent=t;e.style.color=ok?"#1f4d2e":"#b3402a"}
$("dlP").onclick=function(){dl("products.csv",toCSV(PR))};
$("dlT").onclick=function(){dl("products-template.csv",toCSV([{n:"Example Product",c:"Insecticide",brand:"Brand name",head:"One-line headline",desc:"Short description",t:"Technical name",ftype:"SC",form:"Liquid",conc:"Active ingredient %",apptype:"Larvicide",phys:"Liquid",ptype:"Bottle",dose:"Per pump",mode:"How it works",features:"Feature one: detail\nFeature two",pests:"Pests it controls",crops:"Cotton, brinjal",moq:"10 Litre",sale:true,sizes:[["500 ml",670,800],["1 Litre",1340,1600]],images:["example.jpg"]}]))};
$("upB").onclick=function(){$("upF").click()};
$("upF").onchange=async function(e){var f=e.target.files[0];e.target.value="";if(!f)return;msg("");
 try{var list=toProducts(parseCSV(await f.text()));if(!list.length)throw new Error("The file has no product rows");
  if(!confirm("Import "+list.length+" product(s)? Products with the same id or name will be replaced by the row in your file."))return;
  var j=await api("POST","/api/admin/products/import",{products:list});msg("Done: "+j.added+" added, "+j.updated+" updated.",true);loadP()}catch(x){msg(x.message,false)}};
/*ENDCSV*/
if(T)start();
</script></body></html>
